<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - My Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <div class="nav-left">
      <a href="index.html" class="logo">My Shop</a>
    </div>
    <ul>
      <li><a href="index.html">Back to Shop</a></li>
      <li><a href="login.html" class="nav-button">Login</a></li>
    </ul>
  </nav>

  <main class="checkout-page">
    <h1>Checkout</h1>
    <p class="checkout-intro">Fill in your delivery details to complete your order.</p>

    <div class="checkout-layout">

      <!-- LEFT: delivery form -->
      <div class="form-box checkout-form">
        <h2>Delivery Details</h2>

        <form id="checkout-form">

          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" name="full-name" required>

          <label for="phone-number">Phone Number</label>
          <input type="tel" id="phone-number" name="phone-number" placeholder="08012345678" pattern="0[0-9]{10}" required>

          <label for="alt-phone">Alternative Phone (optional)</label>
          <input type="tel" id="alt-phone" name="alt-phone" placeholder="08012345678" pattern="0[0-9]{10}">

          <label for="email">Email (optional)</label>
          <input type="email" id="email" name="email" placeholder="you@example.com">

          <label for="area">Area</label>
          <select id="area" name="area" required>
            <option value="">Select your area</option>
            <option>Ugbowo</option>
            <option>GRA</option>
            <option>Uselu</option>
            <option>Ikpoba Hill</option>
            <option>Oka</option>
            <option>Other</option>
          </select>

          <label for="address">Delivery Address</label>
          <textarea id="address" name="address" rows="3" placeholder="House number, street name" required></textarea>

          <label for="landmark">Nearest Landmark</label>
          <input type="text" id="landmark" name="landmark" placeholder="e.g. opposite the filling station">

          <label for="delivery-time">Preferred Delivery Time</label>
          <select id="delivery-time" name="delivery-time">
            <option>Any time</option>
            <option>Morning</option>
            <option>Afternoon</option>
            <option>Evening</option>
          </select>

          <label for="notes">Delivery Notes (optional)</label>
          <textarea id="notes" name="notes" rows="2" placeholder="e.g. call me when you reach the gate"></textarea>

          <p class="group-title">Payment Method</p>
          <label class="radio-label">
            <input type="radio" name="payment" value="transfer" checked> Bank transfer
          </label>
          <label class="radio-label">
            <input type="radio" name="payment" value="delivery"> Pay on delivery
          </label>

          <label class="radio-label terms">
            <input type="checkbox" name="confirm" required> I confirm that my details are correct
          </label>

          <button type="submit">Place Order</button>
        </form>
      </div>

      <!-- RIGHT: order summary -->
      <aside class="order-summary">
        <h2>Order Summary</h2>

        <div id="summary-items">
          <!-- Sample items. In step 3, JavaScript will replace these with the real cart. -->
          <div id="summary-items"></div>
            <span>Product One &times; 1</span>
            <span>₦2,000</span>
            <button type="submit" id="place-order">Place Order</button>
          </div>
          <div id="summary-items"></div>
            <span>Product Two &times; 2</span>
            <span>₦7,000</span>
            <button type="submit" id="place-order">Place Order</button>
          </div>
        </div>

        <div class="summary-row">
          <span>Delivery fee</span>
          <span>Confirmed after order</span>
        </div>

        <div class="summary-row summary-total">
          <span>Subtotal</span>
          <span id="summary-total">₦9,000</span>
        </div>

        <a href="index.html#products" class="edit-cart">&larr; Edit cart</a>
      </aside>

    </div>
  </main>

  <footer>
    <p class="footer-bottom" style="border-top: none; margin-top: 0; padding-top: 0;">&copy; 2026 My Shop. All rights reserved.</p>
  </footer>
<script src="cart.js"></script>
</body>
</html>
